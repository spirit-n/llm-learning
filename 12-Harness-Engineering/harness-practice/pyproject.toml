[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness-practice"
version = "0.1.0"
description = "Deterministic Agent Harness with budgets, guards, recovery, verification and traces"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
live = ["httpx>=0.28,<1"]

[project.scripts]
harness-demo = "harness_lab.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["live: calls a real model endpoint and may incur cost"]

