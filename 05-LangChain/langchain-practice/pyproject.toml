[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-core-practice"
version = "0.1.0"
description = "Offline-first LangChain practice project"
requires-python = ">=3.12"
dependencies = [
  "langchain>=1.3.14,<1.4",
  "langgraph>=1.2,<1.3",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
live = ["httpx>=0.28,<1"]

[project.scripts]
langchain-demo = "lc_lab.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: calls a real model endpoint and may incur cost"]
