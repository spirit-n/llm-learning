[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-database"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["SQLAlchemy>=2.0,<3", "PyMySQL[rsa]>=1.1,<2", "python-dotenv>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]
