[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-workflow-practice"
version = "0.1.0"
description = "Stateful and resumable LangGraph practice"
requires-python = ">=3.12"
dependencies = [
  "learning-database>=0.1,<0.2",
  "langgraph>=1.2.9,<1.3",
  "pydantic>=2.12,<3",
  "sqlglot>=30.13,<31",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
live = ["httpx>=0.28,<1"]
persistence = ["langgraph-checkpoint-mysql[pymysql]>=3,<4", "langgraph-checkpoint-sqlite>=3.1,<4"]

[project.scripts]
langgraph-demo = "lg_lab.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: calls a real model endpoint and may incur cost"]
