[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-workflow-practice"
version = "0.1.0"
description = "Stateful and resumable LangGraph practice"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.2.9,<1.3",
  "pydantic>=2.12,<3",
  "sqlglot>=28,<30",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
live = ["httpx>=0.28,<1"]

[project.scripts]
langgraph-demo = "lg_lab.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: calls a real model endpoint and may incur cost"]
