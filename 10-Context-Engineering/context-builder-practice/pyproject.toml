[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auditable-context-builder"
version = "0.1.0"
description = "Deterministic and auditable context engineering practice"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
context-builder-demo = "context_lab.demo:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
live = ["httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
markers = ["live: calls a real model endpoint and may incur cost"]
