[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscope-routing-practice"
version = "0.2.0"
description = "Offline AgentScope multi-agent collaboration and failure-boundary practice"
requires-python = ">=3.12"
dependencies = ["agentscope==2.0.4.post1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2"]
live = ["httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = ["live: calls a real model endpoint and may incur cost"]
