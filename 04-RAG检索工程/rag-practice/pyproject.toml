[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-retrieval-practice"
version = "0.1.0"
description = "Offline RAG retrieval pipeline for learning"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
live = ["httpx>=0.28,<1"]

[project.scripts]
rag-demo = "rag_lab.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
markers = ["live: calls a real model endpoint and may incur cost"]
