[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-delegation-practice"
version = "0.2.0"
description = "Task lifecycle, idempotency and custom HTTP versus A2A 1.x practice"
requires-python = ">=3.12"
dependencies = [
  "a2a-sdk[http-server]>=1.1.2,<1.2",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2"]
live = ["httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
filterwarnings = ['ignore:label\(\) is deprecated.*:DeprecationWarning:a2a\.utils\.proto_utils']
markers = ["live: calls a real model endpoint and may incur cost"]
