[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skill-loading-practice"
version = "0.1.0"
description = "Progressive discovery and testing harness for the SQL review skill"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6,<7", "sqlglot>=30.13,<31"]

[project.scripts]
skill-loading-demo = "skill_lab.demo:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
live = ["httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
markers = ["live: calls a real model endpoint and may incur cost"]
