services:
  app:
    build:
      context: ../..
      dockerfile: 15-部署与生产工程/deployment-practice/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../../.env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
